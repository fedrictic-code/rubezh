name: rubezh_editor
description: Редактор игры «Рубеж» — карты, юниты, оружие, звуки, эффекты; публикация на GitHub и сборка APK.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  rubezh:
    path: ../flutter
  http: ^1.2.2
  file_selector: ^1.0.3
  path_provider: ^2.1.4
  path: ^1.9.0
  crypto: ^3.0.5
  image: ^4.2.0
  audioplayers: ^6.1.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
