name: rubezh
description: Рубеж — тактика в реальном времени, Украина против России.
publish_to: none
version: 0.5.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.1.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sfx/
  fonts:
    - family: Russo
      fonts:
        - asset: assets/fonts/RussoOne-Regular.ttf
