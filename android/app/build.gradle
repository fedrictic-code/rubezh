plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.rubezh.game'
    compileSdk 34

    defaultConfig {
        applicationId 'ru.rubezh.game'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.4'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
