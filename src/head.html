<title>Рубеж</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Oswald:wght@500;600&display=swap">
<style>
/* Раскладка: полноэкранное поле боя, поверх него стеклянные панели HUD.
   Цвета: графит и сталь; янтарь — только выбор и действие; синий/красный — стороны. */
:root{--ink:#0c1013;--panel:rgba(14,19,23,.9);--panel2:rgba(26,33,39,.95);--line:rgba(255,255,255,.1);--txt:#e9edf0;--mut:#8e9aa4;--amber:#e3b341;--ua:#3d8fe0;--ru:#d4483f;--ok:#7ec27a;--warn:#ee8a3a;--bad:#e0584a;
--disp:"Oswald","Arial Narrow",sans-serif;--body:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--txt);font:14px/1.35 var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:var(--ink)}
#view{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;inset:0;pointer-events:none}
#hud [hidden]{display:none!important}
.glass{background:var(--panel);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.ib{width:32px;height:32px;border-radius:8px;border:0;background:transparent;display:grid;place-items:center;color:var(--txt)}
.ib:hover{background:rgba(255,255,255,.07)}
.ib svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sp{min-width:30px;height:32px;border-radius:8px;border:0;background:transparent;font:600 12px var(--mono);color:var(--mut)}
.sp.on{background:rgba(227,179,65,.16);color:var(--amber)}
/* верхняя панель: одна строка (пауза и скорость, цели, время и очки) */
.top{position:absolute;left:0;right:0;top:0;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:start;padding:6px max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));pointer-events:none}
.top>*{pointer-events:auto}
.ctl,.right{display:flex;gap:0;align-items:center;padding:2px;border-radius:10px}
.right{grid-column:3;gap:8px;padding:2px 2px 2px 10px}
.clock{font:600 15px var(--mono);letter-spacing:.02em}
.clock small{display:none}
.pts{font:600 13px var(--mono);color:var(--amber);white-space:nowrap}
.pts small{font:500 10px var(--mono);color:var(--mut);margin-left:3px}
.objs{display:flex;gap:6px;justify-content:center;flex-wrap:nowrap;min-width:0;pointer-events:none}
.obj{pointer-events:auto;padding:3px 8px 5px;min-width:0;flex:1 1 0;max-width:180px;overflow:hidden;border-radius:9px}
.obj b{display:flex;justify-content:space-between;gap:6px;font:600 10px var(--disp);letter-spacing:.06em;text-transform:uppercase;line-height:1.2}
.obj b span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.obj b i{flex:none;font:500 9px var(--body);font-style:normal;color:var(--mut);letter-spacing:0;text-transform:none}
.obj .bar{position:relative;height:4px;border-radius:2px;background:rgba(255,255,255,.1);margin-top:3px;overflow:hidden;display:flex}
.obj .bar u{display:block;height:100%}
.obj .bar u:first-child{background:var(--ua)}.obj .bar u:last-child{background:var(--ru);margin-left:auto}
.obj.hold{border-color:rgba(227,179,65,.55)}
#mini{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:46px;width:112px;height:70px;border-radius:8px;border:1px solid var(--line);background:#0a0d0f;pointer-events:auto;touch-action:none;box-shadow:0 4px 16px rgba(0,0,0,.4);opacity:.92}
#log{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:46px;display:flex;flex-direction:column;gap:4px;max-width:min(280px,calc(100% - 160px));pointer-events:none}
#log .it{pointer-events:auto;padding:4px 8px;border-radius:7px;background:var(--panel);border-left:3px solid var(--mut);font-size:11px;line-height:1.3;animation:in .2s ease-out;transition:opacity .6s}
#log .it.good{border-color:var(--ok)}#log .it.bad{border-color:var(--bad)}#log .it.warn{border-color:var(--warn)}#log .it.info{border-color:#6c8cae}
#log .it.out{opacity:0}
@keyframes in{from{transform:translateX(-10px);opacity:0}}
@media (max-width:640px){.right{grid-column:auto}.top{grid-template-columns:auto auto;justify-content:space-between;gap:4px}.objs{grid-column:1/-1;order:3}#mini{top:84px}#log{top:84px;max-width:calc(100% - 140px)}.clock{font-size:14px}}
/* подбор сил и расстановка */
.card.wide{width:min(720px,100%);padding:20px 20px 18px;max-height:calc(100dvh - 24px);display:flex;flex-direction:column}
.fhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.fbud{text-align:right}.fbud b{display:block;font:600 24px var(--mono);color:var(--amber);line-height:1}.fbud small{font:500 10px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.fbar{height:6px;border-radius:3px;background:rgba(255,255,255,.1);margin:10px 0 8px;overflow:hidden}.fbar u{display:block;height:100%;background:var(--amber);transition:width .15s}
#fList{overflow:auto;flex:1;min-height:120px;margin:6px -6px 0;padding:0 6px;touch-action:pan-y}
#fList h4{margin:12px 0 6px;font:600 11px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.fr{display:grid;grid-template-columns:40px 1fr auto auto;gap:2px 10px;align-items:center;padding:8px 6px;border-bottom:1px solid var(--line)}
.fr img{width:40px;height:40px;border-radius:8px;grid-row:span 2}
.fr b{font:600 14px var(--disp);letter-spacing:.03em}.fr p{margin:0;grid-column:2;font-size:11px;color:var(--mut);line-height:1.3}
.fr .c{font:600 12px var(--mono);color:var(--amber);grid-row:span 2}
.fr .st{grid-row:span 2;display:flex;align-items:center;gap:4px}.fr .st button{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-size:18px;line-height:1}.fr .st button[disabled]{opacity:.3}.fr .st i{min-width:22px;text-align:center;font:600 14px var(--mono);font-style:normal}
#deployBar{position:absolute;left:50%;transform:translateX(-50%);top:44px;z-index:12;display:flex;gap:10px;align-items:center;padding:5px 5px 5px 12px;border-radius:12px;background:var(--panel2);border:1px solid rgba(227,179,65,.5);box-shadow:0 6px 20px rgba(0,0,0,.45);max-width:calc(100% - 24px);pointer-events:auto}
#deployBar[hidden]{display:none}#deployBar b{display:inline;font:600 12px var(--disp);letter-spacing:.1em;text-transform:uppercase;color:var(--amber);margin-right:8px}#deployBar span{font-size:11px;color:var(--mut);white-space:nowrap}
#deployBar .go{margin:0;width:auto;height:34px;padding:0 14px;font-size:13px;white-space:nowrap;border-radius:9px;letter-spacing:.1em}
.deploying .cmdwrap,.deploying #objs{display:none}
@media (max-width:640px){#deployBar{top:84px}#deployBar span{white-space:normal}}
/* студия графики */
.stu{overflow:auto}.stu>*{flex-shrink:0}.stuBody{display:grid;grid-template-columns:minmax(0,380px) 1fr;gap:16px;margin:10px 0;min-height:0}
.stuPrev canvas{width:100%;max-width:380px;aspect-ratio:360/260;border-radius:12px;border:1px solid var(--line);background:repeating-conic-gradient(#3a4a30 0 25%,#42543a 0 50%) 0 0/16px 16px;cursor:crosshair;touch-action:none}
.stuCtl{display:flex;flex-direction:column;gap:6px;min-width:0}
.sl{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:12px;color:var(--mut);align-items:center}.sl>span{grid-column:1/-1;color:var(--txt)}.sl small{color:var(--mut)}
.sl input[type=range]{grid-column:1;width:100%;accent-color:var(--amber);min-height:28px}.sl b{font:600 12px var(--mono);color:var(--amber);min-width:30px;text-align:right}
.sl select,.sl input[type=number]{grid-column:1/-1;width:100%;height:40px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--txt);padding:0 10px;font:500 14px var(--body)}
.sl select option,.sl select optgroup{background:#161c21;color:#e8edf0}
.sl.chk{display:flex;gap:8px;align-items:center}.sl.chk>span{grid-column:auto}.sl.chk input{width:20px;height:20px;accent-color:var(--amber)}
@media (max-width:760px){.stuBody{grid-template-columns:1fr}}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:92px;padding:5px 12px;border-radius:999px;background:var(--panel2);border:1px solid rgba(227,179,65,.5);font-size:12px;color:var(--txt);pointer-events:none;white-space:normal;text-align:center;max-width:min(80%,460px);overflow:hidden;text-overflow:ellipsis}
/* нижняя панель: слева карточка отряда, справа способности и приказы */
.dock{position:absolute;left:0;right:0;bottom:0;display:grid;gap:8px;padding:0 max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));grid-template-columns:minmax(0,290px) minmax(0,1fr);grid-template-areas:"sel cmd";align-items:end;pointer-events:none}
.dock>*{pointer-events:auto}
@media (max-width:700px){.dock{grid-template-columns:minmax(0,1fr);grid-template-areas:"cmd" "sel"}}
#sel{grid-area:sel;padding:6px 8px;border-radius:10px}
#sel .empty{color:var(--mut);font-size:12px;display:flex;flex-direction:column;gap:3px;align-items:flex-start;justify-content:center;min-height:34px}
.lnk{background:none;border:0;padding:0;color:var(--amber);font-size:12px;text-decoration:underline;text-underline-offset:3px}
#sel .row{display:flex;gap:8px;align-items:center}

.bars{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.bar3{font-size:9px;color:var(--mut);letter-spacing:.03em;line-height:1.1}

#sel .load{display:none;flex-wrap:wrap;gap:3px;margin:6px 0 0;max-height:64px;overflow:auto}

.chips{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px;margin-top:5px;touch-action:pan-x}
.chip{flex:none;display:flex;gap:4px;align-items:center;padding:2px 6px 2px 3px;border-radius:7px;background:rgba(255,255,255,.06);border:1px solid var(--line);font:500 10px var(--mono)}
.chip img{width:18px;height:18px;border-radius:4px}
.cmdwrap{grid-area:cmd;display:flex;flex-direction:column;gap:5px;min-width:0;align-items:flex-end;justify-self:end;max-width:100%}
#cmds2{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;max-width:100%}#cmds2::-webkit-scrollbar{display:none}
.cmd2{flex:none;height:26px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:11px;display:flex;gap:5px;align-items:center;white-space:nowrap}
.cmd2 kbd,.cmd kbd,.ab span{display:none;font:500 8px var(--mono);color:var(--mut)}
@media (hover:hover) and (min-width:900px){.cmd2 kbd{display:inline}}
.cmd2.on{border-color:var(--amber);color:var(--amber);background:rgba(227,179,65,.12)}.cmd2[disabled]{opacity:.38}
.rowb{display:flex;gap:8px;align-items:flex-end;max-width:100%}
#cmds{display:flex;gap:4px}
.cmd{flex:none;width:54px;height:44px;border-radius:10px;display:flex;flex-direction:column;gap:2px;align-items:center;justify-content:center;font-size:9px;letter-spacing:.01em;line-height:1;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:0}
.cmd svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

#abil{display:flex;gap:4px}
.ab{position:relative;width:40px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;overflow:hidden;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:0}

@media (max-width:820px){.dock{grid-template-columns:minmax(0,230px) minmax(0,1fr)}.cmd{width:46px}.ab{width:34px}.rowb{gap:6px}}

/* подкрепление */
.sheet{position:absolute;right:max(8px,env(safe-area-inset-right,0px));top:42px;bottom:8px;width:min(330px,62%);z-index:20;overflow:auto;background:rgba(22,28,33,.97);border:1px solid var(--line);border-radius:12px;padding:8px 10px 10px;pointer-events:auto;touch-action:pan-y;box-shadow:0 8px 30px rgba(0,0,0,.5)}

.grid{display:grid;grid-template-columns:1fr;gap:5px}

.q{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;font:500 10px var(--mono);color:var(--mut)}
.q i{font-style:normal;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.07)}
/* экраны */
.screen{position:absolute;inset:0;z-index:30;display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));overflow:auto;touch-action:pan-y;background:linear-gradient(180deg,rgba(8,11,13,.55),rgba(8,11,13,.85))}
.screen[hidden]{display:none}
.card{width:min(560px,100%);padding:26px 26px 22px;border-radius:18px;background:var(--panel2);border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.55)}

.row2{display:flex;gap:8px;margin-top:10px}
