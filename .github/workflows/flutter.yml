name: Flutter
on:
  push:
    branches: [main]
    paths: ['flutter/**', '.github/workflows/flutter.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.29.3', channel: stable, cache: true }
      - name: Платформенные папки
        run: |
          mkdir -p ci_out
          flutter create --platforms=android,ios,macos,web --project-name rubezh --org com.rubezh . > ci_out/create.txt 2>&1 || true
          rm -f test/widget_test.dart
          sed -i 's/android:label="rubezh"/android:label="Рубеж"/' android/app/src/main/AndroidManifest.xml || true
      - name: pub get
        run: flutter pub get > ci_out/pubget.txt 2>&1 || (cat ci_out/pubget.txt; exit 1)
      - name: analyze
        id: analyze
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings > ci_out/analyze.txt 2>&1
      - name: test
        id: test
        continue-on-error: true
        run: flutter test --reporter expanded > ci_out/test.txt 2>&1
      - name: APK
        id: apk
        continue-on-error: true
        run: flutter build apk --release > ci_out/apk.txt 2>&1
      - name: Web
        id: web
        continue-on-error: true
        run: flutter build web --release > ci_out/web.txt 2>&1
      - name: Скриншоты
        if: steps.web.outcome == 'success'
        continue-on-error: true
        run: |
          pip install playwright > /dev/null && python -m playwright install --with-deps chromium > /dev/null
          (cd build/web && python -m http.server 8099 > /dev/null 2>&1 &)
          sleep 2
          python ci/shot.py ci_out http://localhost:8099 $(cat ci/screens.txt) > ci_out/shot.txt 2>&1
      - name: Диагностика в ветку ci-out
        if: always()
        run: |
          for f in analyze test apk web; do tail -n 400 ci_out/$f.txt > ci_out/$f.tail.txt 2>/dev/null || true; done
          echo "analyze=${{ steps.analyze.outcome }} test=${{ steps.test.outcome }} apk=${{ steps.apk.outcome }} web=${{ steps.web.outcome }} sha=${{ github.sha }}" > ci_out/STATUS.txt
          rm -rf /tmp/ciout && mkdir /tmp/ciout && cp -r ci_out/. /tmp/ciout/
          cd /tmp/ciout && git init -q -b ci-out && git config user.name ci && git config user.email ci@users.noreply.github.com && git add -A && git commit -qm "ci ${{ github.sha }}" && git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-out
      - uses: actions/upload-artifact@v4
        if: steps.apk.outcome == 'success'
        with:
          name: rubezh-flutter-apk
          path: flutter/build/app/outputs/flutter-apk/app-release.apk
      - name: Итог
        if: always()
        run: |
          [ "${{ steps.test.outcome }}" = success ] && [ "${{ steps.apk.outcome }}" = success ] || { echo "::error title=Flutter::test=${{ steps.test.outcome }} apk=${{ steps.apk.outcome }} (подробности в ветке ci-out)"; exit 1; }
