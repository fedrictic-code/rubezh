name: Сборка APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Собрать игру (вшить картинки из art/)
        run: |
          pip install pillow
          python build.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Android SDK уже установлен на раннере, отдельное действие не нужно
      - name: Проверить Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Собрать debug-APK
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --console=plain 2>&1 | tee ../build.log || {
            msg=$(tail -n 40 ../build.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Gradle::$msg"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: rubezh-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
